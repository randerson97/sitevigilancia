<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
  <form id="loginForm" class="bg-white p-6 rounded shadow-md space-y-4">
    <h1 class="text-2xl font-bold">Login</h1>
    <input id="email" type="email" placeholder="E-mail" required class="w-full px-3 py-2 border rounded" />
    <input id="password" type="password" placeholder="Senha" required class="w-full px-3 py-2 border rounded" />
    <button type="submit" class="w-full bg-green-600 text-white py-2 rounded">Entrar</button>
  </form>
  <script type="module" src="../js/login.js"></script>
</body>
</html>
